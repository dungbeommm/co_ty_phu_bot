name: Validate Ty Phu Bot

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ty-phu-bot-validation
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint source code
        run: python -m ruff check app tests setup-token.py

      - name: Compile all Python modules
        run: python -m compileall -q app tests setup-token.py

      - name: Run full unit-test suite
        run: python -m unittest discover -s tests -v

  docker-build:
    name: Build production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag ty-phu-bot:ci .

      - name: Verify image entry point
        run: docker run --rm --entrypoint python ty-phu-bot:ci -m compileall -q app
